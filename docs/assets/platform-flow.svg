<svg width="980" height="620" viewBox="0 0 980 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Nimbipost adapter flow</title>
  <desc id="desc">A diagram showing one SDK interface connected to platform adapters and social APIs.</desc>
  <rect width="980" height="620" rx="20" fill="#F8FAFC"/>
  <rect x="42" y="42" width="896" height="536" rx="16" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2"/>
